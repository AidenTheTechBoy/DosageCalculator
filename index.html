<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <title>Dosage Calculator</title>
  </head>
  <body class="bg-light">
    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
          <div class="card shadow-sm">
            <div class="card-body p-4">
              <h1 class="card-title text-center mb-4">Dosage Calculator</h1>

              <form id="dosage-form" class="row g-3">
                <div class="col-12">
                  <label for="weightLbs" class="form-label">Weight (lbs)</label>
                  <input type="number" class="form-control" id="weightLbs" step="any" min="0" required>
                </div>

                <div class="col-12">
                  <label for="dosageMgPerKg" class="form-label">Dosage (mg/kg)</label>
                  <input type="number" class="form-control" id="dosageMgPerKg" step="any" min="0" required>
                </div>

                <div class="col-12">
                  <label for="frequencyPerDay" class="form-label">Frequency Per Day</label>
                  <input type="number" class="form-control" id="frequencyPerDay" step="1" min="1" required>
                </div>

                <div class="col-12">
                  <label for="pillSizeMg" class="form-label">Pill Size (mg)</label>
                  <input type="number" class="form-control" id="pillSizeMg" step="any" min="0.01" required>
                </div>

                <div class="col-12">
                  <button type="submit" class="btn btn-primary w-100">Calculate</button>
                </div>
              </form>

              <div id="output" class="alert alert-secondary mt-4 mb-0" role="status">
                Enter values above and click Calculate.
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="./calculator.js"></script>
    <script>
      const dosageForm = document.getElementById('dosage-form');
      const output = document.getElementById('output');

      dosageForm.addEventListener('submit', function (event) {
        event.preventDefault();

        const weightLbs = Number(document.getElementById('weightLbs').value);
        const dosageMgPerKg = Number(document.getElementById('dosageMgPerKg').value);
        const frequencyPerDay = Number(document.getElementById('frequencyPerDay').value);
        const pillSizeMg = Number(document.getElementById('pillSizeMg').value);

        const dailyDosageMg = calculateDailyDosageMg(weightLbs, dosageMgPerKg);
        const individualDosageMg = calculateIndividualDosage(dailyDosageMg, frequencyPerDay);
        const dailyPills = calculateNumberOfPills(dailyDosageMg, pillSizeMg);
        const individualPills = calculateNumberOfPills(individualDosageMg, pillSizeMg);

        output.innerHTML = `
          <div><strong>Daily dosage:</strong> ${roundToNearestHundredth(dailyDosageMg)} mg daily</div>
          <div><strong>Per dose:</strong> ${roundToNearestHundredth(individualDosageMg)} mg per dose</div>
          <div><strong>Pills per day:</strong> ${roundToNearestHundredth(dailyPills)} pills per day</div>
          <div><strong>Pills per dose:</strong> ${roundToNearestHundredth(individualPills)} pills per dose</div>
        `;
      });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF" crossorigin="anonymous"></script>
  </body>
</html>
